group = "com.illuminationdevelopment.inmobi_ads"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // InMobi SDK 11.1.0+ requires AGP 8.9.3 or newer. Consuming apps below
        // that will fail to resolve the SDK's own dependency metadata rather
        // than failing here, which is a confusing place to land — see README.
        classpath("com.android.tools.build:gradle:8.9.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.illuminationdevelopment.inmobi_ads"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // InMobi SDK 11.x floor.
        minSdk = 21
        consumerProguardFiles "consumer-rules.pro"
    }
}

dependencies {
    implementation "com.inmobi.monetization:inmobi-ads-kotlin:11.4.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
